# ==============================================================================
# AI Adaptive Coach v7.0 - Production Nginx Configuration
# Infrastructure: Selectel / Yandex Cloud RF Data Centers
# Security Standards: TLS 1.3, HSTS Preload, OWASP Security Headers, 152-FZ PII Protection
# ==============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log Format with Microsecond Timings & Telemetry Headers
    log_format  production  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time" '
                            'ssl_proto=$ssl_protocol ssl_cipher=$ssl_cipher';

    access_log  /var/log/nginx/access.log  production;

    # Performance Optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Request Body & Telemetry Buffer Limits (Supports 50MB .FIT / Garmin activity files)
    client_max_body_size 50M;
    client_body_buffer_size 512k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Rate Limiting Zones (DDoS & Brute-Force Defense)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Gzip Compression for Fast PWA & B2B Telemetry Loading
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Upstream FastAPI App Cluster
    upstream backend_api {
        server web:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # HTTP Server Block: Redirect Port 80 -> HTTPS Port 443
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME Challenge Endpoint for Certbot SSL Renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Nginx Health Check (Used by Cloud Load Balancers / Orchestration)
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Permanent Redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Production Server Block: TLS 1.3, OWASP & Proxy Routing
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Certificates (Managed by Certbot / Mounted from deploy/ssl)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_dhparam         /etc/nginx/ssl/dhparam.pem;

        # TLS Protocols & Cipher Suites (Strict TLS 1.3 & High-Security TLS 1.2)
        ssl_protocols TLSv1.3 TLSv1.2;
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # SSL Session Cache & OCSP Stapling Settings
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # HTTP Strict Transport Security (HSTS - 2 Years with Subdomains & Preload)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # OWASP Recommended Security Headers (152-FZ Compliant Data Protection)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Health check endpoint over HTTPS
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ----------------------------------------------------------------------
        # Prometheus Metrics Endpoint Scraper Proxy (/metrics)
        # ----------------------------------------------------------------------
        location /metrics {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://backend_api/metrics;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # Athlete PWA Route Proxy (/pwa)
        # ----------------------------------------------------------------------
        location /pwa {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_api/pwa;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }

        # PWA Static Assets Route (/pwa_static)
        location /pwa_static/ {
            proxy_pass http://backend_api/pwa_static/;
            proxy_http_version 1.1;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # ----------------------------------------------------------------------
        # B2B Coach Portal Route Proxy (/coach)
        # ----------------------------------------------------------------------
        location /coach {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://backend_api/coach;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }

        # Coach Portal Static Assets Route (/coach_static)
        location /coach_static/ {
            proxy_pass http://backend_api/coach_static/;
            proxy_http_version 1.1;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # ----------------------------------------------------------------------
        # AI Coach Generation Endpoint Rate Limiting Rate (/api/v1/ai-coach)
        # ----------------------------------------------------------------------
        location /api/v1/ai-coach/ {
            limit_req zone=ai_limit burst=5 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://backend_api/api/v1/ai-coach/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # ----------------------------------------------------------------------
        # Primary Backend API Proxy (Root / API Routing)
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Header Forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket & SSE Push Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
